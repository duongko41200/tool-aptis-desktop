<title>EngDaily — Lo-fi Study</title>
<link rel="stylesheet" href="EngDaily/styles.css" />
<style>
  /* Warm lofi-room fallback behind the user's background image-slot */
  #bg-layer {
    background:
      radial-gradient(80% 60% at 72% 26%, rgba(255,224,150,0.55), rgba(255,224,150,0) 60%),
      radial-gradient(70% 70% at 18% 80%, rgba(120,170,130,0.4), rgba(120,170,130,0) 55%),
      linear-gradient(160deg, #5b6b4a 0%, #7d8a63 30%, #a99f73 60%, #6e6450 100%);
  }
  /* keep the empty drop-slot subtle and inviting, not a harsh box */
  #bg-layer image-slot { --slot-bg: transparent; }
</style>
<template id="__bundler_thumbnail">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">

    <rect x="30" y="42" width="40" height="14" rx="7" fill="#d9e89d"/>
    <path d="M34 64h32M34 72h22" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
  </svg>
</template>
