<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{font-family:var(--ed-font);background:#fff;padding:24px;display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap}
  .b{background:var(--ed-accent)}
  .box{display:flex;flex-direction:column;align-items:center;gap:10px}
  .sq{width:88px;background:var(--ed-accent-deep)}
  .lbl{font:700 12px var(--ed-font);color:var(--ed-ink)}
  .sub{font:500 11px var(--ed-font-mono);color:var(--ed-ink-3)}
</style></head>
<body>
  <div class="box"><div class="sq" style="height:88px;border-radius:12px"></div><div class="lbl">r-sm</div><div class="sub">12px</div></div>
  <div class="box"><div class="sq" style="height:88px;border-radius:18px"></div><div class="lbl">r-md</div><div class="sub">18px</div></div>
  <div class="box"><div class="sq" style="height:88px;border-radius:26px"></div><div class="lbl">r-lg</div><div class="sub">26px</div></div>
  <div class="box"><div class="sq" style="height:88px;border-radius:34px"></div><div class="lbl">r-xl</div><div class="sub">34px</div></div>
  <div class="box"><div class="sq" style="height:50px;width:120px;border-radius:9999px"></div><div class="lbl">r-pill</div><div class="sub">9999 · buttons/chips</div></div>
</body></html>
