<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{font-family:var(--ed-font);background:#fff;padding:22px}
  .grid{display:flex;gap:14px;flex-wrap:wrap}
  .sw{width:150px;border-radius:var(--ed-r-md);overflow:hidden;border:1px solid var(--ed-glass-edge)}
  .chip{height:74px}
  .meta{padding:9px 11px}
  .n{font:700 13px var(--ed-font);color:var(--ed-ink)}
  .h{font:500 11px var(--ed-font-mono);color:var(--ed-ink-3)}
</style></head>
<body>
<div class="grid">
  <div class="sw"><div class="chip" style="background:#d9e89d"></div><div class="meta"><div class="n">accent</div><div class="h">#d9e89d</div></div></div>
  <div class="sw"><div class="chip" style="background:#c5e063"></div><div class="meta"><div class="n">accent-strong</div><div class="h">#c5e063</div></div></div>
  <div class="sw"><div class="chip" style="background:#aacb4f"></div><div class="meta"><div class="n">accent-deep</div><div class="h">#aacb4f</div></div></div>
  <div class="sw"><div class="chip" style="background:#2c3a16"></div><div class="meta"><div class="n" >accent-ink</div><div class="h">#2c3a16</div></div></div>
</div>
</body></html>
