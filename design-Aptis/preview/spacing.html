<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{font-family:var(--ed-font);background:#fff;padding:24px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .bar{display:flex;flex-direction:column;align-items:center;gap:8px}
  .blk{background:var(--ed-accent-deep);border-radius:4px}
  .n{font:600 10px var(--ed-font-mono);color:var(--ed-ink-3)}
</style></head>
<body>
  <!-- 4px rhythm -->
  <div class="bar"><div class="blk" style="width:4px;height:4px"></div><div class="n">1·4</div></div>
  <div class="bar"><div class="blk" style="width:8px;height:8px"></div><div class="n">2·8</div></div>
  <div class="bar"><div class="blk" style="width:11px;height:11px"></div><div class="n">3·11</div></div>
  <div class="bar"><div class="blk" style="width:14px;height:14px"></div><div class="n">4·14</div></div>
  <div class="bar"><div class="blk" style="width:16px;height:16px"></div><div class="n">5·16</div></div>
  <div class="bar"><div class="blk" style="width:20px;height:20px"></div><div class="n">6·20</div></div>
  <div class="bar"><div class="blk" style="width:22px;height:22px"></div><div class="n">7·22</div></div>
  <div class="bar"><div class="blk" style="width:26px;height:26px"></div><div class="n">8·26</div></div>
  <div class="bar"><div class="blk" style="width:32px;height:32px"></div><div class="n">10·32</div></div>
  <div style="margin-left:14px;font:500 12px var(--ed-font);color:var(--ed-ink-2);max-width:180px">4px base rhythm. Grid gap 16, panel padding 20–26.</div>
</body></html>
