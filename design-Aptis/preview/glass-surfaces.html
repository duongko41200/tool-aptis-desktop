<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{font-family:var(--ed-font);
    background:
      radial-gradient(80% 60% at 72% 26%, rgba(255,224,150,0.45), rgba(255,224,150,0) 60%),
      linear-gradient(160deg,#5b6b4a,#7d8a63 40%,#6e6450);
    padding:22px;display:flex;gap:16px;flex-wrap:wrap}
  .light{background:var(--ed-glass);backdrop-filter:blur(18px) saturate(1.25);-webkit-backdrop-filter:blur(18px) saturate(1.25);
    border:1px solid var(--ed-glass-line);box-shadow:var(--ed-sh-md),var(--ed-sh-inset);border-radius:var(--ed-r-lg);padding:20px;flex:1;min-width:200px}
  .dark{background:var(--ed-darkglass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:1px solid var(--ed-darkglass-line);box-shadow:var(--ed-sh-inset);border-radius:var(--ed-r-lg);padding:20px;flex:1;min-width:200px;color:#fff}
  .t{font:800 17px var(--ed-font);letter-spacing:-0.02em}
  .s{font:500 13px/1.5 var(--ed-font);margin-top:6px}
</style></head>
<body>
  <div class="light"><div class="t">Light glass</div><div class="s" style="color:var(--ed-ink-2)">rgba(255,255,255,.74) · blur 18px · dark ink. The default content surface — bright & readable.</div></div>
  <div class="dark"><div class="t">Dark glass</div><div class="s" style="color:var(--ed-on-dark-2)">rgba(28,36,24,.42) · blur 14px · white text. Chrome only: top bar, rail, player.</div></div>
</body></html>
