<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{font-family:var(--ed-font);background:linear-gradient(160deg,#5b6b4a,#7d8a63 40%,#6e6450);padding:24px;display:flex;gap:16px;flex-wrap:wrap}
  .card{width:240px;border-radius:var(--ed-r-lg);padding:24px;box-shadow:var(--ed-sh-sm)}
  .front{background:#fff;border:1px solid var(--ed-glass-edge)}
  .back{background:var(--ed-accent);box-shadow:var(--ed-sh-glow);color:var(--ed-accent-ink)}
  .tag{display:inline-block;font:600 11px var(--ed-font);padding:4px 10px;border-radius:9999px;background:rgba(217,232,157,0.6);color:var(--ed-accent-ink)}
  .w{font:800 34px var(--ed-font);letter-spacing:-0.03em;color:var(--ed-ink);margin-top:18px}
  .ipa{font:500 15px var(--ed-font-mono);color:var(--ed-ink-3);margin-top:4px}
  .label{font:800 11px var(--ed-font);letter-spacing:.12em;text-transform:uppercase}
</style></head>
<body>
  <div class="card front">
    <span class="tag">Mới</span>
    <div class="w">serene</div>
    <div class="ipa">/səˈriːn/ · adj.</div>
    <div style="margin-top:24px;font:600 12px var(--ed-font);color:var(--ed-ink-3);text-align:center">Chạm để xem nghĩa →</div>
  </div>
  <div class="card back">
    <div class="label" style="color:rgba(44,58,22,.55)">Nghĩa</div>
    <div style="font:800 22px var(--ed-font);margin-top:4px">thanh bình, yên ả</div>
    <div class="label" style="color:rgba(44,58,22,.55);margin-top:18px">Ví dụ</div>
    <div style="font:600 15px/1.5 var(--ed-font);margin-top:4px">The lake was perfectly serene at dawn.</div>
  </div>
</body></html>
