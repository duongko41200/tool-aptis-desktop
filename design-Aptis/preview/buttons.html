<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{font-family:var(--ed-font);
    background:linear-gradient(160deg,#5b6b4a,#7d8a63 40%,#6e6450);padding:24px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;gap:9px;font-weight:700;font-size:15px;padding:13px 22px;border-radius:9999px;border:none}
  .primary{background:var(--ed-accent);color:var(--ed-accent-ink);box-shadow:var(--ed-sh-glow)}
  .ghost{background:var(--ed-darkglass);color:#fff;border:1px solid var(--ed-darkglass-line);backdrop-filter:blur(12px)}
  .soft{background:rgba(255,255,255,0.6);color:var(--ed-ink);border:1px solid var(--ed-glass-edge)}
  .sm{padding:9px 15px;font-size:13px}
</style></head>
<body>
  <button class="btn primary">Bắt đầu học</button>
  <button class="btn ghost">Ôn từ vựng</button>
  <button class="btn soft">Lưu nháp</button>
  <button class="btn primary sm">Nộp bài</button>
  <button class="btn ghost sm">Xem video</button>
</body></html>
