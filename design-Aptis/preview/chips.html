<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{font-family:var(--ed-font);background:#eef0ea;padding:24px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .chip{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;padding:7px 13px;border-radius:9999px;color:var(--ed-ink-2);background:rgba(255,255,255,0.7);border:1px solid var(--ed-glass-edge)}
  .accent{background:rgba(217,232,157,0.6);color:var(--ed-accent-ink);border-color:rgba(170,203,79,0.4)}
  .dot{width:8px;height:8px;border-radius:50%}
  .label{font:800 11px var(--ed-font);letter-spacing:.12em;text-transform:uppercase;color:var(--ed-ink-3)}
</style></head>
<body>
  <span class="chip accent">Mới</span>
  <span class="chip">142 từ đã thuộc</span>
  <span class="chip"><span class="dot" style="background:var(--ed-good)"></span> Đang lắng nghe</span>
  <span class="chip" style="font-family:var(--ed-font-mono)">02:18:05</span>
  <span class="chip accent">Streak 9 ngày</span>
  <span class="label" style="margin-left:6px">Eyebrow label</span>
</body></html>
