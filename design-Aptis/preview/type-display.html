<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{font-family:var(--ed-font);
    background:
      radial-gradient(80% 60% at 72% 26%, rgba(255,224,150,0.45), rgba(255,224,150,0) 60%),
      radial-gradient(70% 70% at 18% 80%, rgba(120,170,130,0.35), rgba(120,170,130,0) 55%),
      linear-gradient(160deg,#5b6b4a,#7d8a63 40%,#6e6450);
    padding:22px;color:var(--ed-ink)}
  .panel{background:var(--ed-glass);backdrop-filter:blur(18px) saturate(1.25);-webkit-backdrop-filter:blur(18px) saturate(1.25);
    border:1px solid var(--ed-glass-line);box-shadow:var(--ed-sh-md),var(--ed-sh-inset);border-radius:var(--ed-r-lg);padding:24px}
  .row{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
</style></head>
<body>
<div class="panel">
  <div style="font:800 40px/1.12 var(--ed-font);letter-spacing:-0.025em">Bắt đầu bài học hôm nay</div>
  <div class="row" style="margin-top:14px">
    <span style="font:800 30px/1.15 var(--ed-font);letter-spacing:-0.025em">Chào buổi sáng, Minh</span>
    <span style="font:800 22px/1.2 var(--ed-font);letter-spacing:-0.02em;color:var(--ed-ink-2)">Nhận xét chi tiết</span>
  </div>
  <div style="margin-top:10px;font:500 13px var(--ed-font);color:var(--ed-ink-3)">Plus Jakarta Sans · 800 / 800 / 800 · tracking -0.025em → -0.02em</div>
</div>
</body></html>
