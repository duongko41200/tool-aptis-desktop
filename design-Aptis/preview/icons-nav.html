<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{font-family:var(--ed-font);background:linear-gradient(160deg,#5b6b4a,#7d8a63 40%,#6e6450);padding:24px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
  .rail{display:flex;gap:11px}
  .ic{width:42px;height:42px;border-radius:9999px;display:grid;place-items:center;background:var(--ed-darkglass);color:#fff;border:1px solid var(--ed-darkglass-line);backdrop-filter:blur(12px)}
  .ic.active{background:var(--ed-accent);color:var(--ed-accent-ink);box-shadow:var(--ed-sh-glow);border-color:var(--ed-accent-strong)}
  .nav{display:flex;gap:4px;padding:6px;border-radius:9999px;background:var(--ed-darkglass);border:1px solid var(--ed-darkglass-line);backdrop-filter:blur(14px)}
  .nb{display:flex;align-items:center;gap:7px;padding:9px 15px;border-radius:9999px;font:700 14px var(--ed-font);color:rgba(255,255,255,.8)}
  .nb.on{background:var(--ed-accent);color:var(--ed-accent-ink)}
  svg{width:18px;height:18px;stroke:currentColor;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}
</style></head>
<body>
  <div class="nav">
    <span class="nb on"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7M6 9.5V20h12V9.5"/></svg>Trang chủ</span>
    <span class="nb"><svg viewBox="0 0 24 24"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></svg>Học tập</span>
    <span class="nb"><svg viewBox="0 0 24 24"><path d="M5 5h14v10H9l-4 3z"/></svg>Nói</span>
  </div>
  <div class="rail">
    <span class="ic"><svg viewBox="0 0 24 24"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM20 20l-3.5-3.5"/></svg></span>
    <span class="ic active"><svg viewBox="0 0 24 24"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM5 20a7 7 0 0 1 14 0"/></svg></span>
    <span class="ic"><svg viewBox="0 0 24 24"><path d="M5 5h14v10H9l-4 3z"/></svg></span>
  </div>
</body></html>
