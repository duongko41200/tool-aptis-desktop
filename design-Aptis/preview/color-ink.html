<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{font-family:var(--ed-font);background:#fff;padding:22px}
  .grid{display:flex;gap:14px;flex-wrap:wrap}
  .sw{width:150px;border-radius:var(--ed-r-md);overflow:hidden;border:1px solid var(--ed-glass-edge)}
  .chip{height:74px}
  .meta{padding:9px 11px}
  .n{font:700 13px var(--ed-font)}
  .h{font:500 11px var(--ed-font-mono);color:var(--ed-ink-3)}
</style></head>
<body>
<div class="grid">
  <div class="sw"><div class="chip" style="background:#232a1e"></div><div class="meta"><div class="n" style="color:#232a1e">ink</div><div class="h">#232a1e</div></div></div>
  <div class="sw"><div class="chip" style="background:#4b5443"></div><div class="meta"><div class="n" style="color:#4b5443">ink-2</div><div class="h">#4b5443</div></div></div>
  <div class="sw"><div class="chip" style="background:#79836d"></div><div class="meta"><div class="n" style="color:#79836d">ink-3</div><div class="h">#79836d</div></div></div>
  <div class="sw"><div class="chip" style="background:#11160c"></div><div class="meta"><div class="n" style="color:#11160c">bg-base</div><div class="h">#11160c</div></div></div>
</div>
</body></html>
